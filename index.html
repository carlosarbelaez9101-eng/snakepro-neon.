
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050914">
<meta name="description" content="SnakePro Neon: juega con paredes o atraviesa los bordes.">
<title>SnakePro Neon</title>
<style>
:root {
  color-scheme: dark;
  --cyan: #35f5ff;
  --purple: #b45cff;
  --pink: #ff3bd4;
  --bg: #050914;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 18px 12px 28px;
  background: radial-gradient(ellipse at top, #12213d, var(--bg) 65%);
  color: #effaff;
  font-family: system-ui, Arial, sans-serif;
  text-align: center;
  overscroll-behavior: none;
}
.app { width: min(100%, 420px); margin: auto; }
h1 {
  margin: 8px 0 3px;
  color: var(--cyan);
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 0 0 18px #35f5ff80;
}
.subtitle {
  color: #c39bff;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 18px;
}
.panel {
  background: #0b1224;
  border: 1px solid #253a5c;
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 0 22px #0008;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.stat {
  background: #0b1930;
  border: 1px solid #23425d;
  border-radius: 12px;
  padding: 9px;
}
.stat small {
  display: block;
  color: #9db3d1;
  font-size: 10px;
  letter-spacing: 1.5px;
}
.stat strong { color: var(--cyan); font-size: 23px; }
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  background: var(--bg);
  border: 2px solid var(--cyan);
  border-radius: 12px;
  box-shadow: 0 0 17px #35f5ff40;
  touch-action: none;
}
.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 12px;
}
button, select {
  min-height: 43px;
  padding: 10px;
  border-radius: 11px;
  border: 1px solid #315071;
  background: #101e35;
  color: #effaff;
  font: inherit;
  font-size: 13px;
}
button { cursor: pointer; touch-action: manipulation; }
button:active { transform: scale(.98); }
button.primary {
  background: linear-gradient(110deg, #123e51, #25204c);
  border-color: var(--cyan);
  color: var(--cyan);
  font-weight: 800;
}
button.selected {
  background: #103b49;
  border-color: var(--cyan);
  box-shadow: 0 0 12px #35f5ff35;
}
select { width: 100%; }
.mode-label {
  color: #a9bddb;
  font-size: 11px;
  letter-spacing: 1px;
  margin: 15px 0 8px;
}
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.modes button { min-height: 55px; }
.modes button:first-child { border-color: var(--cyan); }
.modes button:last-child { border-color: var(--purple); }
.modes button:last-child.selected { color: #dfbaff; background: #291a43; }
.joystick-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  padding: 18px 0 8px;
}
#joystick {
  width: 124px;
  height: 124px;
  border: 2px solid #277f9b;
  border-radius: 50%;
  background: radial-gradient(circle, #122c48, #07101e);
  position: relative;
  touch-action: none;
  box-shadow: inset 0 0 20px #35f5ff20, 0 0 16px #35f5ff17;
}
#joyKnob {
  position: absolute;
  width: 43px;
  height: 43px;
  left: 39px;
  top: 39px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #c5ffff, #35f5ff 60%, #1170a1);
  box-shadow: 0 0 16px #35f5ffb0;
  pointer-events: none;
}
.joy-arrows {
  position: absolute;
  inset: 7px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  place-items: center;
  color: #79eaff;
  opacity: .6;
  font-size: 13px;
  pointer-events: none;
}
.joy-arrows span:nth-child(1) { grid-area: 1/2; }
.joy-arrows span:nth-child(2) { grid-area: 2/1; }
.joy-arrows span:nth-child(3) { grid-area: 2/3; }
.joy-arrows span:nth-child(4) { grid-area: 3/2; }
.hint { max-width: 125px; color: #a7bad5; font-size: 12px; line-height: 1.6; }
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #020610d9;
}
.overlay.hidden { display: none; }
.overlay-card {
  width: min(100%, 370px);
  padding: 24px 18px;
  border-radius: 20px;
  border: 1px solid var(--cyan);
  background: #0b1224;
  box-shadow: 0 0 35px #35f5ff30;
}
.overlay-card h2 { color: var(--cyan); margin: 0 0 8px; }
.overlay-card p { color: #c3d1e6; font-size: 13px; line-height: 1.6; }
.overlay-card .modes { margin: 14px 0; }
.overlay-card .primary { width: 100%; }
.footer { color: #647b9b; font-size: 10px; margin-top: 15px; }
</style>
</head>
<body>
<main class="app">
  <h1>SNAKEPRO</h1>
  <div class="subtitle">✦ NEON ARCADE ✦</div>

  <section class="panel">
    <div class="stats">
      <div class="stat">
        <small>PUNTUACIÓN</small>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <small>RÉCORD</small>
        <strong id="best">0</strong>
      </div>
    </div>

    <canvas id="game" width="360" height="360"></canvas>

    <div class="settings">
      <select id="difficulty" aria-label="Dificultad">
        <option value="180">Fácil</option>
        <option value="125" selected>Normal</option>
        <option value="85">Difícil</option>
        <option value="55">Experto</option>
      </select>
      <button id="soundBtn" type="button">🔊 Sonido</button>
      <button id="playBtn" class="primary" type="button">▶ Jugar</button>
      <button id="pauseBtn" type="button">Ⅱ Pausar</button>
      <button id="restartBtn" type="button">↻ Reiniciar</button>
    </div>

    <div class="mode-label">ELIGE TU MODO DE JUEGO</div>
    <div class="modes">
      <button id="wallModeBtn" class="selected" type="button">🧱 Con paredes</button>
      <button id="noWallModeBtn" type="button">♾️ Sin paredes</button>
    </div>

    <div class="joystick-area">
      <div id="joystick" aria-label="Joystick para dirigir la serpiente">
        <div class="joy-arrows">
          <span>▲</span><span>◀</span><span>▶</span><span>▼</span>
        </div>
        <div id="joyKnob"></div>
      </div>
      <div class="hint">Mueve el joystick o desliza el dedo sobre el tablero para cambiar de dirección.</div>
    </div>
  </section>
  <div class="footer">SNAKEPRO NEON · JUEGA, CRECE Y SUPERA TU RÉCORD</div>
</main>

<div id="overlay" class="overlay">
  <div class="overlay-card">
    <h2 id="overlayTitle">¿Listo para jugar?</h2>
    <p id="overlayText">Elige un modo y pulsa Jugar. ¡Consigue la mayor puntuación!</p>
    <div class="modes">
      <button id="wallModeBtnMenu" type="button">🧱 Con paredes</button>
      <button id="noWallModeBtnMenu" type="button">♾️ Sin paredes</button>
    </div>
    <button id="overlayPlayBtn" class="primary" type="button">▶ Comenzar partida</button>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const playBtn = document.getElementById("playBtn");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");
const soundBtn = document.getElementById("soundBtn");
const difficulty = document.getElementById("difficulty");
const joystick = document.getElementById("joystick");
const joyKnob = document.getElementById("joyKnob");

const cells = 18;
const cellSize = 20;

let snake = [];
let food = null;
let dir = {x:1,y:0};
let nextDir = {x:1,y:0};
let score = 0;
let best = 0;
let running = false;
let paused = false;
let over = false;
let wallMode = true;
let timer = null;
let soundOn = true;
let audioContext = null;

try {
  best = Number(localStorage.getItem("snakepro-neon-best")) || 0;
} catch (_) {}
bestEl.textContent = best;

function playTone(freq, duration) {
  if (!soundOn) return;
  try {
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + duration);
  } catch (_) {}
}

function showOverlay(title, message) {
  overlayTitle.textContent = title;
  overlayText.textContent = message;
  overlay.classList.remove("hidden");
}

function hideOverlay() {
  overlay.classList.add("hidden");
}

function placeFood() {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(s => s.x === p.x && s.y === p.y));
  food = p;
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem("snakepro-neon-best", String(best)); } catch (_) {}
  }
}

function draw() {
  ctx.fillStyle = "#050914";
  ctx.fillRect(0, 0, 360, 360);

  ctx.strokeStyle = "rgba(53,245,255,.075)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= cells; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cellSize, 0);
    ctx.lineTo(i * cellSize, 360);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * cellSize);
    ctx.lineTo(360, i * cellSize);
    ctx.stroke();
  }

  if (wallMode) {
    ctx.strokeStyle = "#35f5ff";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#35f5ff";
    ctx.shadowBlur = 9;
    ctx.strokeRect(1, 1, 358, 358);
    ctx.shadowBlur = 0;
  }

  if (food) {
    ctx.save();
    ctx.shadowColor = "#ff3bd4";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ff3bd4";
    ctx.beginPath();
    ctx.arc(food.x * cellSize + 10, food.y * cellSize + 10, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  if (snake) {
    snake.forEach((p, i) => {
      ctx.save();
      ctx.shadowColor = i === 0 ? "#35f5ff" : "#31d6ad";
      ctx.shadowBlur = i === 0 ? 14 : 7;
      ctx.fillStyle = i === 0 ? "#b4ffff" :
        `hsl(${164 - Math.min(i * 2, 55)},90%,${58 - Math.min(i * .25, 12)}%)`;
      ctx.beginPath();
      ctx.roundRect(p.x * cellSize + 2, p.y * cellSize + 2, 16, 16, 4);
      ctx.fill();
      ctx.restore();
    });

    const h = snake[0];
    const ox = dir.x * 3;
    const oy = dir.y * 3;
    ctx.fillStyle = "#07111c";
    ctx.beginPath();
    ctx.arc(h.x * 20 + 7 + ox, h.y * 20 + 7 + oy, 1.8, 0, Math.PI * 2);
    ctx.arc(h.x * 20 + 13 + ox, h.y * 20 + 7 + oy, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function gameOver() {
  running = false;
  over = true;
  if (timer) clearInterval(timer);
  timer = null;
  playTone(180, .2);
  showOverlay("¡Fin del juego!", "Puntuación: " + score + ". Pulsa Comenzar para intentarlo otra vez.");
  playBtn.textContent = "▶ Jugar otra vez";
}

function tick() {
  if (!running || paused || over) return;
  dir = nextDir;

  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  // Modo con paredes: chocar contra el borde termina la partida.
  if (wallMode && (
    head.x < 0 || head.x >= cells ||
    head.y < 0 || head.y >= cells
  )) {
    gameOver();
    return;
  }

  // Modo sin paredes: reaparecer en el borde opuesto.
  if (!wallMode) {
    head.x = (head.x + cells) % cells;
    head.y = (head.y + cells) % cells;
  }

  const eating = food && head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);

  if (body.some(p => p.x === head.x && p.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    updateScore();
    playTone(620, .09);
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function scheduleLoop() {
  if (timer) clearInterval(timer);
  timer = setInterval(tick, Number(difficulty.value));
}

function reset() {
  snake = [{x:8,y:9},{x:7,y:9},{x:6,y:9}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  running = false;
  paused = false;
  over = false;
  if (timer) clearInterval(timer);
  timer = null;
  placeFood();
  updateScore();
  draw();
  playBtn.textContent = "▶ Jugar";
  pauseBtn.textContent = "Ⅱ Pausar";
}

function start() {
  if (over) reset();
  if (running && !paused) return;
  running = true;
  paused = false;
  over = false;
  hideOverlay();
  playBtn.textContent = "▶ En juego";
  pauseBtn.textContent = "Ⅱ Pausar";
  scheduleLoop();
}

function chooseWallMode(withWalls) {
  wallMode = withWalls;

  document.getElementById("wallModeBtn").classList.toggle("selected", withWalls);
  document.getElementById("noWallModeBtn").classList.toggle("selected", !withWalls);

  reset();
  hideOverlay();
  start();
}

document.getElementById("wallModeBtn").addEventListener("click", () => chooseWallMode(true));
document.getElementById("noWallModeBtn").addEventListener("click", () => chooseWallMode(false));
document.getElementById("wallModeBtnMenu").addEventListener("click", () => chooseWallMode(true));
document.getElementById("noWallModeBtnMenu").addEventListener("click", () => chooseWallMode(false));
document.getElementById("overlayPlayBtn").addEventListener("click", start);

playBtn.addEventListener("click", start);

restartBtn.addEventListener("click", () => {
  reset();
  start();
});

pauseBtn.addEventListener("click", () => {
  if (!running && !paused) return;

  paused = !paused;
  pauseBtn.textContent = paused ? "▶ Continuar" : "Ⅱ Pausar";

  if (paused) {
    if (timer) clearInterval(timer);
    timer = null;
    showOverlay("Partida pausada", "Pulsa Continuar para seguir jugando.");
  } else {
    hideOverlay();
    scheduleLoop();
  }
});

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊 Sonido" : "🔇 Silencio";
  if (soundOn) playTone(500, .08);
});

difficulty.addEventListener("change", () => {
  if (running && !paused) scheduleLoop();
});

function setDirection(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
}

document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp: [0,-1], w: [0,-1], W: [0,-1],
    ArrowDown: [0,1], s: [0,1], S: [0,1],
    ArrowLeft: [-1,0], a: [-1,0], A: [-1,0],
    ArrowRight: [1,0], d: [1,0], D: [1,0]
  };
  if (keys[e.key]) {
    e.preventDefault();
    setDirection(keys[e.key][0], keys[e.key][1]);
  }
  if (e.key === " " && running) {
    e.preventDefault();
    pauseBtn.click();
  }
});

let swipeStart = null;

canvas.addEventListener("pointerdown", e => {
  const r = canvas.getBoundingClientRect();
  swipeStart = {
    x: e.clientX - r.left,
    y: e.clientY - r.top
  };
});

canvas.addEventListener("pointerup", e => {
  if (!swipeStart) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  const dx = x - swipeStart.x;
  const dy = y - swipeStart.y;
  swipeStart = null;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? 1 : -1, 0);
  } else {
    setDirection(0, dy > 0 ? 1 : -1);
  }
});

let joyPointer = null;

function moveJoystick(e) {
  const r = joystick.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const distance = Math.hypot(dx, dy);
  const max = 36;
  const scale = distance > max ? max / distance : 1;

  joyKnob.style.left = (r.width / 2 - 21 + dx * scale) + "px";
  joyKnob.style.top = (r.height / 2 - 21 + dy * scale) + "px";

  if (distance > 12) {
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
  }
}

joystick.addEventListener("pointerdown", e => {
  joyPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  moveJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (joyPointer === e.pointerId) moveJoystick(e);
});

function releaseJoystick(e) {
  if (joyPointer !== e.pointerId) return;
  joyPointer = null;
  joyKnob.style.left = "39px";
  joyKnob.style.top = "39px";
}

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

reset();
showOverlay("¿Listo para jugar?", "Elige un modo de juego y pulsa Comenzar partida.");
})();
</script>
</body>
</html>
