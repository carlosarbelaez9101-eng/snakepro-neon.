
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>SnakePro Neon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b18;color:#eafcff;font-family:Arial,sans-serif;text-align:center}
h1{color:#00f7ff;text-shadow:0 0 15px #00f7ff;margin:15px 0}
.panel{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px}
.stat{background:#111c31;border:1px solid #00d9ff;border-radius:10px;padding:9px}
button{background:#10243c;color:#fff;border:1px solid #00eaff;border-radius:9px;padding:11px;margin:4px;font-weight:bold}
button:active{background:#007b92}
canvas{background:#050914;border:2px solid #00eaff;border-radius:10px;width:min(92vw,400px);height:min(92vw,400px);max-width:400px;max-height:400px}
#message{min-height:24px;color:#ffe66d}
.controls{display:grid;grid-template-columns:55px 55px 55px;gap:5px;justify-content:center;margin:10px}
.controls button{height:48px;font-size:20px;margin:0}
.power{max-width:420px;margin:10px auto;padding:8px}
</style>
</head>
<body>
<h1>🐍 SnakePro Neon</h1>

<div class="panel">
  <div class="stat">Puntos: <span id="score">0</span></div>
  <div class="stat">🪙 Monedas: <span id="coins">0</span></div>
  <div class="stat">Récord: <span id="best">0</span></div>
</div>

<canvas id="game" width="400" height="400"></canvas>
<p id="message">¡Come, gana monedas y activa poderes!</p>

<div>
  <button onclick="startGame()">▶ Jugar / Reiniciar</button>
  <button onclick="toggleWalls()">🧱 Paredes: <span id="wallLabel">Sí</span></button>
</div>

<div class="power">
  <h3>⚡ Poderes especiales</h3>
  <button onclick="buyPower('shield')">🛡️ Escudo — 30 🪙</button>
  <button onclick="buyPower('fast')">🐇 Velocidad — 20 🪙</button>
  <button onclick="buyPower('slow')">🐢 Lentitud — 20 🪙</button>
  <p id="powerStatus">Sin poderes activos</p>
</div>

<div class="controls">
  <span></span><button onclick="setDir(0,-1)">⬆️</button><span></span>
  <button onclick="setDir(-1,0)">⬅️</button>
  <button onclick="setDir(0,1)">⬇️</button>
  <button onclick="setDir(1,0)">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 20;
const cells = 20;

let snake, food, direction, nextDirection;
let score = 0;
let coins = Number(localStorage.getItem("snakeCoins") || 0);
let best = Number(localStorage.getItem("snakeBest") || 0);
let walls = true;
let running = false;
let shield = false;
let speedUntil = 0;
let slowUntil = 0;
let loop = null;

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const bestEl = document.getElementById("best");
const messageEl = document.getElementById("message");
const powerEl = document.getElementById("powerStatus");

function updateStats(){
  scoreEl.textContent = score;
  coinsEl.textContent = coins;
  bestEl.textContent = best;
  localStorage.setItem("snakeCoins", coins);
  localStorage.setItem("snakeBest", best);
}

function randomFood(){
  let p;
  do {
    p = {
      x: Math.floor(Math.random()*cells),
      y: Math.floor(Math.random()*cells)
    };
  } while(snake && snake.some(s => s.x===p.x && s.y===p.y));
  return p;
}

function startGame(){
  clearInterval(loop);
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  direction = {x:1,y:0};
  nextDirection = {x:1,y:0};
  score = 0;
  shield = false;
  speedUntil = 0;
  slowUntil = 0;
  food = randomFood();
  running = true;
  messageEl.textContent = "¡Partida iniciada!";
  updateStats();
  refreshPower();
  scheduleLoop();
  draw();
}

function scheduleLoop(){
  clearInterval(loop);
  let delay = Date.now() < slowUntil ? 190 : Date.now() < speedUntil ? 65 : 115;
  loop = setInterval(tick, delay);
}

function setDir(x,y){
  if(!running) return;
  if(x === -direction.x && y === -direction.y) return;
  nextDirection = {x,y};
}

function toggleWalls(){
  walls = !walls;
  document.getElementById("wallLabel").textContent = walls ? "Sí" : "No";
  messageEl.textContent = walls ? "Las paredes están activadas." : "Puedes atravesar los bordes.";
}

function buyPower(type){
  if(!running){
    messageEl.textContent = "Pulsa Jugar antes de comprar poderes.";
    return;
  }

  if(type === "shield"){
    if(shield){
      messageEl.textContent = "Ya tienes un escudo preparado.";
      return;
    }
    if(coins < 30){
      messageEl.textContent = "Necesitas 30 monedas para el escudo.";
      return;
    }
    coins -= 30;
    shield = true;
    messageEl.textContent = "🛡️ Escudo activado: bloqueará una colisión.";
  }

  if(type === "fast" || type === "slow"){
    if(coins < 20){
      messageEl.textContent = "Necesitas 20 monedas para este poder.";
      return;
    }
    coins -= 20;
    if(type === "fast"){
      speedUntil = Date.now() + 5000;
      slowUntil = 0;
      messageEl.textContent = "🐇 ¡Velocidad aumentada durante 5 segundos!";
    } else {
      slowUntil = Date.now() + 5000;
      speedUntil = 0;
      messageEl.textContent = "🐢 Velocidad reducida durante 5 segundos.";
    }
    scheduleLoop();
  }

  updateStats();
  refreshPower();
}

function refreshPower(){
  let active = [];
  if(shield) active.push("🛡️ Escudo disponible");
  if(Date.now() < speedUntil) active.push("🐇 Velocidad");
  if(Date.now() < slowUntil) active.push("🐢 Lentitud");
  powerEl.textContent = active.length ? active.join(" · ") : "Sin poderes activos";
}

function tick(){
  if(!running) return;

  direction = nextDirection;
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if(!walls){
    head.x = (head.x + cells) % cells;
    head.y = (head.y + cells) % cells;
  } else if(head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells){
    if(shield){
      shield = false;
      head.x = Math.max(0,Math.min(cells-1,head.x));
      head.y = Math.max(0,Math.min(cells-1,head.y));
      messageEl.textContent = "🛡️ ¡El escudo bloqueó el choque!";
      refreshPower();
    } else {
      return gameOver();
    }
  }

  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0,-1);
  const hitSelf = body.some(part => part.x === head.x && part.y === head.y);

  if(hitSelf){
    if(shield){
      shield = false;
      messageEl.textContent = "🛡️ ¡Escudo usado para bloquear el choque!";
      refreshPower();
      return;
    }
    return gameOver();
  }

  snake.unshift(head);

  if(eating){
    score += 10;
    coins += 5;
    food = randomFood();
    messageEl.textContent = "¡+10 puntos y +5 monedas!";
    if(score > best) best = score;
    updateStats();
  } else {
    snake.pop();
  }

  if(Date.now() >= speedUntil && Date.now() >= slowUntil){
    refreshPower();
  }

  draw();
}

function gameOver(){
  running = false;
  clearInterval(loop);
  messageEl.textContent = "💥 Fin de la partida. Pulsa Jugar para intentarlo de nuevo.";
  draw();
}

function draw(){
  ctx.fillStyle = "#050914";
  ctx.fillRect(0,0,400,400);

  ctx.strokeStyle = "#101f35";
  for(let i=0;i<=400;i+=size){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke();
  }

  if(food){
    ctx.shadowColor = "#ff3978";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ff3978";
    ctx.beginPath();
    ctx.arc(food.x*size+10,food.y*size+10,7,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if(snake){
    snake.forEach((part,i)=>{
      ctx.fillStyle = i===0 ? "#faffff" : "#00eaff";
      ctx.shadowColor = "#00eaff";
      ctx.shadowBlur = i===0 ? 15 : 7;
      ctx.fillRect(part.x*size+2,part.y*size+2,size-4,size-4);
    });
    ctx.shadowBlur = 0;
  }
}

document.addEventListener("keydown",e=>{
  const keys = {
    ArrowUp:[0,-1], w:[0,-1],
    ArrowDown:[0,1], s:[0,1],
    ArrowLeft:[-1,0], a:[-1,0],
    ArrowRight:[1,0], d:[1,0]
  };
  const key = keys[e.key];
  if(key){
    e.preventDefault();
    setDir(key[0],key[1]);
  }
});

updateStats();
startGame();
</script>
</body>
</html>
