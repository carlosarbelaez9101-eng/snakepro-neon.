
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050816">
<meta name="description" content="SnakePro Neon: juega a la serpiente con estilo neón, niveles y música retro.">
<title>SnakePro Neon</title>

<style>
:root {
  --cyan: #00f5ff;
  --pink: #ff2bd6;
  --green: #39ff88;
  --bg: #050816;
  --panel: #0c1430;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #111d46 0%, var(--bg) 65%);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  overscroll-behavior: none;
  touch-action: manipulation;
}
header { padding: 18px 10px 8px; }
h1 {
  margin: 0;
  font-size: clamp(28px, 7vw, 42px);
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan), 0 0 22px #0077ff;
}
.subtitle {
  margin: 6px 0 12px;
  color: #a7b9e8;
  font-size: 12px;
  letter-spacing: 3px;
}
.wrap { width: min(94vw, 520px); margin: auto; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0;
}
.stat {
  padding: 10px 5px;
  background: #0b1230;
  border: 1px solid #253d72;
  border-radius: 12px;
  box-shadow: inset 0 0 14px #111d45;
}
.stat small {
  display: block;
  color: #91a5d9;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.stat strong {
  display: block;
  margin-top: 4px;
  color: var(--green);
  font-size: 22px;
  text-shadow: 0 0 8px #1aff86;
}
.board-shell {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 2px solid var(--cyan);
  border-radius: 14px;
  box-shadow: 0 0 12px #00eaff88, 0 0 30px #0066ff44;
  background: #030713;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}
.controls {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin: 12px 0 8px;
}
button {
  border: 1px solid #315b9e;
  border-radius: 12px;
  padding: 12px 8px;
  background: linear-gradient(145deg, #131f45, #090f26);
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 0 10px #004d8c22;
}
button:active { transform: scale(.97); }
button.primary {
  border-color: var(--cyan);
  color: var(--cyan);
  box-shadow: inset 0 0 12px #00d9ff19, 0 0 12px #00d9ff22;
}
button.pink { border-color: var(--pink); color: #ff8bea; }
.joystick {
  width: 210px;
  max-width: 75vw;
  margin: 15px auto 10px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 55px);
  gap: 7px;
}
.joystick button {
  padding: 0;
  font-size: 23px;
  color: var(--cyan);
  border-radius: 15px;
  font-weight: 900;
}
.joystick .up { grid-column: 2; grid-row: 1; }
.joystick .left { grid-column: 1; grid-row: 2; }
.joystick .down { grid-column: 2; grid-row: 2; }
.joystick .right { grid-column: 3; grid-row: 2; }
.hint {
  color: #9baed8;
  font-size: 12px;
  line-height: 1.6;
  margin: 12px auto 24px;
}
.hidden { display: none !important; }
footer {
  color: #4c6295;
  font-size: 11px;
  padding: 5px 10px 20px;
}
</style>
</head>

<body>
<header>
  <h1>SNAKEPRO NEON</h1>
  <div class="subtitle">ARCADE • NEON • RETRO</div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><small>Puntuación</small><strong id="score">0</strong></div>
    <div class="stat"><small>Nivel</small><strong id="level">1</strong></div>
    <div class="stat"><small>Récord</small><strong id="best">0</strong></div>
  </section>

  <div class="board-shell">
    <canvas id="game" width="400" height="400" aria-label="Tablero de SnakePro Neon"></canvas>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">▶ Nuevo juego</button>
    <button id="pauseBtn">Ⅱ Pausar</button>
    <button id="musicBtn">♫ Música: OFF</button>
    <button class="pink" id="soundBtn">♪ Sonido: ON</button>
  </div>

  <div class="joystick" aria-label="Joystick">
    <button class="up" data-dir="up" aria-label="Arriba">▲</button>
    <button class="left" data-dir="left" aria-label="Izquierda">◀</button>
    <button class="down" data-dir="down" aria-label="Abajo">▼</button>
    <button class="right" data-dir="right" aria-label="Derecha">▶</button>
  </div>

  <p class="hint">
    Usa el joystick, las flechas del teclado o desliza el dedo sobre el tablero.<br>
    Come los puntos verdes, evita las paredes y los obstáculos.
  </p>
</main>

<footer>SnakePro Neon · Arcade Edition</footer>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const canvas = $("game");
  const ctx = canvas.getContext("2d");

  const SIZE = 20;
  const CELL = canvas.width / SIZE;
  const CENTER = Math.floor(SIZE / 2);

  let snake = [];
  let direction = { x: 1, y: 0 };
  let nextDirection = { x: 1, y: 0 };
  let food = { x: 14, y: 10 };
  let obstacles = [];
  let score = 0;
  let level = 1;
  let foodsThisLevel = 0;
  let best = 0;
  let running = false;
  let paused = false;
  let gameOver = false;

  // Al subir de nivel, la serpiente espera un movimiento del jugador.
  let waitingForMove = false;

  let loopTimer = null;
  let musicOn = false;
  let soundOn = true;
  let audioContext = null;
  let musicTimer = null;
  let musicStep = 0;
  let touchStart = null;

  try {
    best = Number(localStorage.getItem("snakeProNeonBest")) || 0;
  } catch (e) {}
  $("best").textContent = best;

  function initAudio() {
    if (!audioContext) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) audioContext = new AudioCtx();
    }
    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }
  }

  function beep(freq = 440, duration = 0.08, type = "square", volume = 0.04) {
    if (!soundOn) return;
    initAudio();
    if (!audioContext) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, audioContext.currentTime + duration
    );
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + duration);
  }

  function startRetroMusic() {
    if (!musicOn || musicTimer) return;
    initAudio();
    if (!audioContext) return;

    const melody = [262, 330, 392, 330, 294, 349, 440, 349,
                    262, 330, 392, 523, 440, 392, 330, 294];

    musicTimer = setInterval(() => {
      if (!musicOn || !running || paused || waitingForMove || gameOver) return;
      const freq = melody[musicStep % melody.length];
      musicStep++;
      beep(freq, 0.09, "square", 0.018);
      if (musicStep % 4 === 0) beep(freq / 2, 0.12, "triangle", 0.012);
    }, 170);
  }

  function stopRetroMusic() {
    if (musicTimer) clearInterval(musicTimer);
    musicTimer = null;
  }

  function makeRooms() {
    obstacles = [];
    if (level < 2) return;

    const mid = CENTER;
    // Los obstáculos crecen poco a poco en los siguientes niveles.
    obstacles.push(
      { x: mid - 3, y: mid - 2 },
      { x: mid - 3, y: mid - 1 },
      { x: mid + 3, y: mid + 1 },
      { x: mid + 3, y: mid + 2 }
    );

    if (level >= 3) {
      for (let x = 5; x <= 8; x++) obstacles.push({ x, y: 4 });
      for (let x = 11; x <= 14; x++) obstacles.push({ x, y: 15 });
    }

    if (level >= 5) {
      for (let y = 7; y <= 12; y++) {
        obstacles.push({ x: 4, y });
        obstacles.push({ x: 15, y });
      }
    }
  }

  function isObstacle(x, y) {
    return obstacles.some(o => o.x === x && o.y === y);
  }

  function placeFood() {
    let attempts = 0;
    do {
      food = {
        x: Math.floor(Math.random() * SIZE),
        y: Math.floor(Math.random() * SIZE)
      };
      attempts++;
    } while (
      attempts < 1000 &&
      (snake.some(s => s.x === food.x && s.y === food.y) ||
       isObstacle(food.x, food.y))
    );
  }

  function stopLoop() {
    if (loopTimer) clearInterval(loopTimer);
    loopTimer = null;
  }

  function startLoop() {
    stopLoop();
    if (!running || paused || gameOver || waitingForMove) return;

    const speed = Math.max(65, 145 - (level - 1) * 7);
    loopTimer = setInterval(tick, speed);
  }

  function resetGame() {
    stopLoop();
    stopRetroMusic();

    score = 0;
    level = 1;
    foodsThisLevel = 0;
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    waitingForMove = false;
    paused = false;
    gameOver = false;
    running = true;

    // Aparece en una zona libre, lejos de los obstáculos.
    snake = [
      { x: 3, y: CENTER },
      { x: 2, y: CENTER },
      { x: 1, y: CENTER }
    ];

    makeRooms();
    placeFood();
    updateStats();
    $("pauseBtn").textContent = "Ⅱ Pausar";

    beep(520, 0.1);
    startLoop();
    startRetroMusic();
    draw();
  }

  function updateStats() {
    $("score").textContent = score;
    $("level").textContent = level;
    $("best").textContent = best;
  }

  function changeDirection(dir) {
    const map = {
      up:    { x: 0, y: -1 },
      down:  { x: 0, y: 1 },
      left:  { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };

    const d = map[dir];
    if (!d || gameOver) return;

    // Al comenzar un nivel nuevo, la serpiente está detenida.
    // Permitimos cualquier primera dirección porque no está avanzando.
    if (!waitingForMove &&
        d.x === -direction.x &&
        d.y === -direction.y) {
      return;
    }

    nextDirection = d;

    if (waitingForMove) {
      waitingForMove = false;
      paused = false;
      running = true;
      direction = d;
      $("pauseBtn").textContent = "Ⅱ Pausar";
      startLoop();
      startRetroMusic();
      beep(620, 0.07);
    } else if (!running && !gameOver) {
      running = true;
      paused = false;
      direction = d;
      startLoop();
    }
  }

  function tick() {
    if (!running || paused || gameOver || waitingForMove) return;

    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // Chocar contra los bordes termina la partida.
    if (head.x < 0 || head.x >= SIZE ||
        head.y < 0 || head.y >= SIZE) {
      endGame();
      return;
    }

    const eating = head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);

    if (body.some(s => s.x === head.x && s.y === head.y) ||
        isObstacle(head.x, head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (eating) {
      score += 10;
      foodsThisLevel++;
      beep(740, 0.08, "square", 0.035);

      if (score > best) {
        best = score;
        try {
          localStorage.setItem("snakeProNeonBest", String(best));
        } catch (e) {}
      }

      if (foodsThisLevel >= 5 && level < 10) {
        levelUp();
        return;
      }
      placeFood();
    } else {
      snake.pop();
    }

    updateStats();
    draw();
  }

  function levelUp() {
    level = Math.min(10, level + 1);
    foodsThisLevel = 0;

    makeRooms();

    // Aleja la serpiente de la zona central y los nuevos obstáculos.
    const starts = [
      [{ x: 2, y: 2 }, { x: 1, y: 2 }, { x: 0, y: 2 }],
      [{ x: 17, y: 2 }, { x: 18, y: 2 }, { x: 19, y: 2 }],
      [{ x: 2, y: 17 }, { x: 1, y: 17 }, { x: 0, y: 17 }],
      [{ x: 17, y: 17 }, { x: 18, y: 17 }, { x: 19, y: 17 }]
    ];

    let selected = starts.find(candidate =>
      candidate.every(s =>
        !isObstacle(s.x, s.y) &&
        !obstacles.some(o => o.x === s.x && o.y === s.y)
      )
    );

    if (!selected) {
      selected = [{ x: 2, y: 2 }, { x: 1, y: 2 }, { x: 0, y: 2 }];
    }

    snake = selected.map(s => ({ ...s }));
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };

    // Congelar el juego hasta que el jugador mueva los controles.
    waitingForMove = true;
    paused = true;
    running = false;
    stopLoop();
    stopRetroMusic();

    placeFood();
    updateStats();

    $("pauseBtn").textContent = "▶ Esperando movimiento";

    // No mostrar ningún mensaje emergente al cambiar de nivel.
    beep(760, 0.13, "square", 0.035);
    draw();
  }

  function endGame() {
    gameOver = true;
    running = false;
    paused = false;
    waitingForMove = false;
    stopLoop();
    stopRetroMusic();
    $("pauseBtn").textContent = "Ⅱ Pausar";
    beep(160, 0.35, "sawtooth", 0.04);
    draw();
  }

  function togglePause() {
    if (gameOver || waitingForMove) return;
    if (!running && !paused) {
      resetGame();
      return;
    }

    paused = !paused;
    if (paused) {
      stopLoop();
      stopRetroMusic();
      $("pauseBtn").textContent = "▶ Continuar";
    } else {
      running = true;
      $("pauseBtn").textContent = "Ⅱ Pausar";
      startLoop();
      startRetroMusic();
    }
    draw();
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#030713";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Cuadrícula sutil.
    ctx.strokeStyle = "#13203b";
    ctx.lineWidth = 0.6;
    for (let i = 0; i <= SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // Obstáculos.
    obstacles.forEach(o => {
      const x = o.x * CELL + 2;
      const y = o.y * CELL + 2;
      ctx.save();
      ctx.shadowBlur = 9;
      ctx.shadowColor = "#ff2bd6";
      ctx.fillStyle = "#68175c";
      ctx.strokeStyle = "#ff2bd6";
      ctx.lineWidth = 1.5;
      roundedRect(x, y, CELL - 4, CELL - 4, 4);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    // Comida.
    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = "#39ff88";
    ctx.fillStyle = "#39ff88";
    ctx.beginPath();
    ctx.arc(
      food.x * CELL + CELL / 2,
      food.y * CELL + CELL / 2,
      CELL * 0.32,
      0, Math.PI * 2
    );
    ctx.fill();
    ctx.restore();

    // Serpiente.
    snake.forEach((s, i) => {
      const x = s.x * CELL + 1.5;
      const y = s.y * CELL + 1.5;
      ctx.save();
      ctx.shadowBlur = i === 0 ? 16 : 8;
      ctx.shadowColor = i === 0 ? "#00f5ff" : "#00aaff";
      ctx.fillStyle = i === 0 ? "#b8ffff" : "#00d9ff";
      ctx.strokeStyle = "#00f5ff";
      ctx.lineWidth = 1;
      roundedRect(x, y, CELL - 3, CELL - 3, 5);
      ctx.fill();
      ctx.stroke();

      if (i === 0) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#06132b";
        const ex = x + CELL / 2;
        const ey = y + CELL / 2;
        ctx.beginPath();
        ctx.arc(ex + direction.x * 3 - direction.y * 3,
                ey + direction.y * 3 + direction.x * 3, 1.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex + direction.x * 3 + direction.y * 3,
                ey + direction.y * 3 - direction.x * 3, 1.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });

    // Indicaciones discretas, sin ventana emergente al subir de nivel.
    if (!running || paused || gameOver || waitingForMove) {
      ctx.fillStyle = "rgba(3, 7, 19, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (gameOver) {
        ctx.font = "bold 27px Arial";
        ctx.fillStyle = "#ff2bd6";
        ctx.shadowColor = "#ff2bd6";
        ctx.shadowBlur = 15;
        ctx.fillText("FIN DEL JUEGO", 200, 180);
        ctx.shadowBlur = 0;
        ctx.font = "15px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Pulsa Nuevo juego", 200, 220);
      } else if (waitingForMove) {
        // Sin texto emergente: solo se ve el tablero congelado.
      } else if (paused) {
        ctx.font = "bold 28px Arial";
        ctx.fillStyle = "#00f5ff";
        ctx.shadowColor = "#00f5ff";
        ctx.shadowBlur = 15;
        ctx.fillText("PAUSA", 200, 200);
        ctx.shadowBlur = 0;
      } else if (!running) {
        ctx.font = "bold 25px Arial";
        ctx.fillStyle = "#00f5ff";
        ctx.shadowColor = "#00f5ff";
        ctx.shadowBlur = 14;
        ctx.fillText("SNAKEPRO NEON", 200, 180);
        ctx.shadowBlur = 0;
        ctx.font = "15px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Pulsa Nuevo juego", 200, 220);
      }
    }
  }

  $("startBtn").addEventListener("click", () => {
    initAudio();
    resetGame();
  });

  $("pauseBtn").addEventListener("click", () => {
    initAudio();
    togglePause();
  });

  $("musicBtn").addEventListener("click", () => {
    initAudio();
    musicOn = !musicOn;
    $("musicBtn").textContent = musicOn ? "♫ Música: ON" : "♫ Música: OFF";

    if (musicOn) startRetroMusic();
    else stopRetroMusic();
  });

  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    $("soundBtn").textContent = soundOn ? "♪ Sonido: ON" : "♪ Sonido: OFF";
    if (soundOn) beep(600, 0.08);
  });

  document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      initAudio();
      changeDirection(button.dataset.dir);
    });
  });

  const keyMap = {
    ArrowUp: "up", w: "up", W: "up",
    ArrowDown: "down", s: "down", S: "down",
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right"
  };

  document.addEventListener("keydown", event => {
    if (keyMap[event.key]) {
      event.preventDefault();
      initAudio();
      changeDirection(keyMap[event.key]);
    } else if (event.key === " " || event.key === "Escape") {
      event.preventDefault();
      togglePause();
    }
  });

  // Deslizar el dedo sobre el tablero para girar.
  canvas.addEventListener("pointerdown", event => {
    touchStart = { x: event.clientX, y: event.clientY };
  });

  canvas.addEventListener("pointerup", event => {
    if (!touchStart) return;

    const dx = event.clientX - touchStart.x;
    const dy = event.clientY - touchStart.y;
    touchStart = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return;

    initAudio();
    if (Math.abs(dx) > Math.abs(dy)) {
      changeDirection(dx > 0 ? "right" : "left");
    } else {
      changeDirection(dy > 0 ? "down" : "up");
    }
  });

  canvas.addEventListener("pointercancel", () => {
    touchStart = null;
  });

  // Dibujar la pantalla inicial sin iniciar el movimiento.
  snake = [
    { x: 3, y: CENTER },
    { x: 2, y: CENTER },
    { x: 1, y: CENTER }
  ];
  makeRooms();
  placeFood();
  updateStats();
  draw();
})();
</script>
</body>
</html>
